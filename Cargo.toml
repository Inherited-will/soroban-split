[package]
name = "soroban-split"
version = "0.1.0"
edition = "2021"
description = "A payment splitting smart contract on Stellar Soroban — send one payment, automatically distribute to multiple recipients by percentage"
license = "MIT"
repository = "https://github.com/Inherited-will/soroban-split"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.7.6", features = [] }

[dev-dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
